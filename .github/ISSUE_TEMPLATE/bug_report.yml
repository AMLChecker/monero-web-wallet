name: Bug report
description: Something is broken — the wallet UI, the backend, the RPC integration or the launcher
title: "[Bug] "
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Never paste your wallet password, recovery phrase or private keys** — they are not needed to debug anything.
        Logs (`logs/backend.log`, `logs/wallet-rpc.log`) contain no secrets and are the right thing to copy from.

        This software is unaudited: please reproduce issues with small amounts.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am running the latest commit of `main`
          required: true
        - label: I did not include any password, seed or private key in this report
          required: true
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and quote any error message exactly as it appears.
      placeholder: "Example: the dashboard shows “Wallet RPC Offline” although monero-wallet-rpc.exe is running."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run Start.bat
        2. Open http://127.0.0.1:18082
        3. Click "Open main" and enter the password
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - Wallet UI (React frontend)
        - Backend API
        - monero-wallet-rpc integration (balance, history, sending, subaddresses)
        - Windows launcher (Start.bat / Stop.bat)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, Ubuntu 24.04, macOS 15, …"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version (`node -v`)
      placeholder: "v22.14.0"
    validations:
      required: false
  - type: input
    id: rpc-version
    attributes:
      label: Wallet RPC version (Settings → About)
      placeholder: "1.0.31"
    validations:
      required: false
  - type: dropdown
    id: daemon
    attributes:
      label: Which Monero node are you using?
      options:
        - Local monerod
        - Remote node
        - No node / offline
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: The few lines around the failure from logs/backend.log or logs/wallet-rpc.log (not the whole file).
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, wallet file size, whether it worked before. Never attach wallet files or keys.
    validations:
      required: false
