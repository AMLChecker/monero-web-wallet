name: Setup or launch problem
description: Start.bat fails, ports are busy, the wallet RPC or the node is not reachable
title: "[Setup] "
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        Most start-up problems are one of these:

        - `monero-wallet-rpc.exe` is not next to `Start.bat` — the Monero binaries are **not** part of this repository;
        - Node.js is missing or older than 18;
        - ports 18082 / 18083 are already used by another instance (`Stop.bat` first);
        - the wallet file is still open in `monero-wallet-cli.exe` or another wallet window.

        The full list is in the [troubleshooting table](https://github.com/AMLChecker/monero-web-wallet#troubleshooting).
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The official Monero binaries are in the same folder as Start.bat
          required: true
        - label: I read the troubleshooting section in the README
          required: true
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Console output of Start.bat
      description: Copy the full text the launcher printed, plus any message shown in the wallet UI.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it stop?
      options:
        - Start.bat does not run (its checks fail)
        - Wallet RPC does not come up
        - Backend does not answer
        - The UI opens but shows “Wallet RPC Offline”
        - “Daemon unavailable” — the node is not reachable
        - The wallet password is rejected
        - Something else
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version (`node -v`)
      placeholder: "v22.14.0"
    validations:
      required: true
  - type: dropdown
    id: daemon
    attributes:
      label: Which Monero node do you use?
      options:
        - Local monerod
        - Remote node
        - No node yet
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: Relevant lines from logs/backend.log and logs/wallet-rpc.log.
      render: shell
    validations:
      required: false
